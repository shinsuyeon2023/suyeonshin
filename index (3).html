<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem("ssussu-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suyeon Shin</title>
<meta name="description" content="Suyeon Shin: builder moving across Singapore, Korea and Berkeley. A portfolio laid out like a spreadsheet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M4 11h24M4 21h24M11 4v24M21 4v24' stroke='%23000' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
/* ===== Tokens: plain spreadsheet look, Arial throughout ===== */
:root{
  color-scheme:light;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --paper:#FFFFFF; --ink:#000000; --muted:#666666; --faint:#9A9A9A;
  --grid:#E1E1E1; --head:#F8F9FA; --head-ink:#5F6368; --hover:#F1F3F4;
  --select:#1A73E8; --hdr-on:#D3E3FD; --link:#1155CC; --cta:#00FF00;
  --gutter:40px; --fs:10px; --row:24px; --band:#F3F3F3; --hov-bg:#000; --hov-ink:#fff; --tab-on:#000;
}
:root[data-theme="dark"]{color-scheme:dark;--paper:#0E1013;--ink:#E8EAED;--muted:#9AA0A6;--faint:#6F757C;--grid:#2A2E35;--head:#15181D;--head-ink:#8A9097;--hover:#1C2026;--select:#8AB4F8;--hdr-on:#1F2F4D;--link:#8AB4F8;--band:#181B20;--hov-bg:#FFFFFF;--hov-ink:#000;--tab-on:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-underline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ===== Top bar: name, always visible ===== */
.top{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--grid);background:var(--paper);flex-wrap:wrap}
.name{margin:0;font-size:calc(var(--fs) + 9px);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.name .caret{display:inline-block;width:2px;height:.9em;background:var(--ink);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:calc(var(--fs) + 2px);color:var(--ink)}
.theme{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--grid);font-size:13px;color:var(--ink)}
.theme:hover{background:var(--hover)}
.theme:focus-visible{outline:2px solid var(--select)}
.tag span+span{color:var(--muted)}
.editbar{display:none;width:100%;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px}
.is-edit .editbar{display:flex}
.btn{cursor:pointer;font-size:12px;padding:5px 10px;border:1px solid var(--grid);border-radius:3px;background:var(--paper);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:focus-visible{outline:2px solid var(--select);outline-offset:1px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{color:#B3261E;border-color:#E9B4B0}
.savestate{font-size:11px;color:var(--muted);margin-left:auto}

/* ===== Grid ===== */
.gridwrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--paper);overscroll-behavior:contain}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{padding:6px 8px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);vertical-align:top;text-align:left;font-weight:400;white-space:normal;overflow-wrap:anywhere;transition:border-color .5s ease}
.grid tbody td{height:var(--row)}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--head-ink);text-align:center;font-size:11px;padding:4px 0;height:24px;vertical-align:middle}
.grid thead th.corner{left:0;z-index:5}
.grid th.rn{position:sticky;left:0;z-index:2;background:var(--head);color:var(--head-ink);text-align:center;font-size:11px;padding:0;vertical-align:middle}
.grid td{background:var(--paper)}
.grid tbody td:hover{background:var(--hov-bg);color:var(--hov-ink)}
.grid tbody td:hover a,.grid tbody td:hover .muted,.grid tbody td:hover .tablink,.grid tbody td:hover .wc{color:var(--hov-ink)}
.grid td.sel{box-shadow:inset 0 0 0 2px var(--select)}
.grid th.on{background:var(--hdr-on);color:#0B57D0}
.grid .b,.b{font-weight:700}
.grid .nw{white-space:nowrap}

/* sheet tabs */
.grid tr.hdr td{font-weight:700;position:sticky;top:0;z-index:1;background:var(--paper);border-bottom-color:#BDBDBD}
.grid tr.hdr th.rn{top:0;z-index:4}
.grid tr.section td{background:var(--band)}
.grid tr.section:hover td,.grid tr.section:hover th.rn{background:var(--hov-bg);color:var(--hov-ink)}
.grid tr.section td.sx{font-weight:700}
.grid tr.sub td.sx{font-weight:700;color:var(--muted)}
.grid tr.note td.sx{color:var(--muted);font-style:italic}
.star{margin-left:5px;font-size:11px}
.status-pill{font-size:10.5px;font-weight:700;color:#137333;letter-spacing:.04em}
.ext{text-decoration:none;font-size:13px}
.ph{display:flex;flex-wrap:wrap;gap:6px}
.ph button{all:unset;cursor:zoom-in;display:block;height:var(--ph,110px);aspect-ratio:4/3;background:var(--band)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button:focus-visible{outline:2px solid var(--select)}
.addph{color:var(--link);font-size:12px;cursor:pointer}

/* colour reveals thread on hover */
.grid tr.item:hover td,.grid tr.item.hl td{background:var(--c1);color:var(--on1)}
.grid tr.item:hover td a,.grid tr.item.hl td a,.grid tr.item:hover .status-pill{color:var(--on1)}
.grid tr.item:hover th.rn,.grid tr.item.hl th.rn{background:linear-gradient(180deg,var(--c1) 0 50%,var(--c2) 50% 100%);color:var(--on1);font-weight:700}
.grid tr.item.plain:hover td,.grid tr.item.plain:hover th.rn,.grid tr.sub:hover td,.grid tr.sub:hover th.rn,.grid tr.note:hover td,.grid tr.note:hover th.rn{background:var(--hov-bg);color:var(--hov-ink)}
.grid tr.item.plain:hover .status-pill,.grid tr.sub:hover td.sx,.grid tr.note:hover td.sx{color:var(--hov-ink)}
.dim tbody tr.item:not(.hl):not(.plain) td{color:var(--faint)}
.grid tr.flash td{animation:flash 1.8s ease}
@keyframes flash{0%,45%{background:#FFF3C4}100%{background:var(--paper)}}
.is-edit .grid tr[data-i]{cursor:pointer}

/* personal sheet */
.grid td.photo{padding:0;position:relative;background:var(--paper);vertical-align:top}
.pwrap{position:relative;width:100%;aspect-ratio:4/5;background:var(--band)}
.grid td.photo:hover{background:var(--paper)}
.grid td.chartcell:hover,.grid td#tinfo:hover,.grid td.nohov:hover,.grid td.photo:hover{background:var(--paper);color:var(--ink)}
.grid td#tinfo:hover .muted{color:var(--muted)}
.grid td.nohov:hover a{color:var(--link)}
.node{outline:none}
.pwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pwrap .ph-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.tl{display:grid;gap:9px}
.tl button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr;gap:3px 8px;align-items:baseline}
.tl i{width:10px;height:10px;background:var(--c);display:block;transform:translateY(1px)}
.tl b{font-weight:700}
.tl span{grid-column:2;color:var(--muted);font-size:12px}
.tl button:hover b,.tl button[aria-pressed="true"] b{color:var(--c)}
.tl button:focus-visible{outline:2px solid var(--select)}
.stack{display:grid;gap:5px}
.stack.cols{display:block;columns:2;column-gap:18px}
.stack.cols div{break-inside:avoid;margin-bottom:5px}
.sw{display:inline-block;width:10px;height:10px;background:var(--c);margin-right:7px;vertical-align:-1px}
ul.bl{margin:0;padding-left:15px}
ul.bl li{margin:0 0 2px}
.cloud.dim .kw:not(.on){opacity:.22}
.grid td.cloudcell:hover{background:var(--paper);color:var(--ink)}
.biotext{white-space:pre-line}
.links a{margin-right:14px;white-space:nowrap}
.cta td{background:var(--cta)!important;font-weight:700;color:#000}
.cta a{color:#000}
.blackrow td{background:#000!important;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.tablink{all:unset;cursor:pointer;color:var(--link);text-decoration:underline;text-underline-offset:2px;margin-right:16px;white-space:nowrap;line-height:1.9}
.tablink:focus-visible{outline:2px solid var(--select)}
.muted{color:var(--muted)}

/* threads chart (inside the Personal sheet) */
.chartcell{padding:4px!important}
.chartcell svg{display:block;width:100%;max-width:760px;height:auto;margin:0 auto}
.node{cursor:pointer}
.node:focus-visible circle.core{stroke:var(--ink);stroke-width:2}
.edge{cursor:pointer;transition:opacity .2s}
.info{display:grid;gap:10px;align-content:start}
.info h3{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.info p{margin:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--grid)}
.kv div{padding:6px 8px;border-right:1px solid var(--grid)}
.kv div:last-child{border-right:0}
.kv b{display:block;font-size:16px}
.kv span{font-size:11px;color:var(--muted)}
.lh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.elist{display:grid;border-top:1px solid var(--grid);max-height:250px;overflow:auto}
.li{all:unset;cursor:pointer;display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:12.5px}
.li i{width:9px;height:9px;background:var(--c)}
.li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li em{font-style:normal;color:var(--faint);font-size:11px}
.li:hover span{text-decoration:underline}
.li:focus-visible{outline:2px solid var(--select)}
.rank{display:grid;gap:6px}
.rk{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 90px 22px;gap:8px;align-items:center;font-size:12.5px}
.rk .bar{height:7px;background:linear-gradient(90deg,var(--a),var(--b))}
.rk b{text-align:right}
.rk:hover .pr{text-decoration:underline}
.rk:focus-visible{outline:2px solid var(--select)}
.cloud{display:flex;flex-wrap:wrap;gap:6px 8px;align-content:flex-start;justify-content:flex-start;padding:2px 0 4px}
.kw{all:unset;cursor:pointer;display:inline-block;padding:3px 8px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--k);font-size:var(--s,1em);line-height:1.3;animation:drift var(--d,6s) ease-in-out var(--dl,0s) infinite alternate;will-change:transform}
.kw:hover,.kw:focus-visible{animation-play-state:paused;background:var(--c);color:var(--on);border-color:var(--c)}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(var(--x1,2px),var(--y1,-4px))}100%{transform:translate(var(--x2,-2px),var(--y2,3px))}}
.wc{font-family:var(--font);color:var(--muted);white-space:pre-line}
.linkbtn{all:unset;cursor:pointer;color:var(--link);text-decoration:underline;font-size:12.5px}
@media (prefers-reduced-motion:reduce){.kw{animation:none}.edge{transition:none}.grid tr.flash td{animation:none}.name .caret{display:none}}

/* ===== Bottom: sheet tabs + status ===== */
.tabs{flex:none;display:flex;align-items:stretch;background:var(--head);border-top:1px solid var(--grid);height:38px;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box}
.tablist{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tablist::-webkit-scrollbar{display:none}
.tabs .plus{all:unset;cursor:pointer;width:38px;flex:none;display:grid;place-items:center;font-size:18px;color:var(--muted);border-right:1px solid var(--grid)}
.tab{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;padding:0 16px;font-size:calc(var(--fs) + 2px);color:var(--muted);white-space:nowrap;border-right:1px solid var(--grid)}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--tab-on)}
.tab:focus-visible{outline:2px solid var(--select);outline-offset:-2px}
.status{flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:12px;color:var(--muted);border-left:1px solid var(--grid);white-space:nowrap;max-width:46%;overflow:hidden}
.status i{display:inline-block;width:9px;height:9px;background:var(--c);margin-right:5px}
.status .t{overflow:hidden;text-overflow:ellipsis}

/* ===== Lightbox ===== */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:none;align-items:center;justify-content:center;padding:40px 56px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%}
.lb button{all:unset;cursor:pointer;position:absolute;color:#fff;font-size:28px;width:44px;height:44px;display:grid;place-items:center}
.lb .x{top:calc(8px + env(safe-area-inset-top,0px));right:8px}
.lb .prev{left:6px;top:50%;transform:translateY(-50%)}
.lb .next{right:6px;top:50%;transform:translateY(-50%)}
.lb button:focus-visible{outline:2px solid #fff}

/* ===== Edit drawer (edit mode only) ===== */
.drawer{position:fixed;right:0;top:var(--toph,0px);bottom:calc(39px + env(safe-area-inset-bottom,0px));width:min(420px,100%);background:var(--paper);z-index:41;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--grid);box-shadow:-6px 0 18px rgba(0,0,0,.08)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--grid);font-size:12px;color:var(--muted)}
.dh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;font-size:18px}
.xbtn:hover{background:var(--hover)}
.db{flex:1;overflow:auto;padding:14px 16px 28px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
.form input[type=text],.form input[type=url],.form input[type=number],.form textarea,.form select{font-size:13px;color:var(--ink);border:1px solid var(--grid);border-radius:2px;padding:7px 8px;background:var(--paper);width:100%}
.form textarea{min-height:100px;resize:vertical;line-height:1.5}
.form input:focus,.form textarea:focus,.form select:focus{outline:2px solid var(--select);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex!important;align-items:center;gap:8px;font-size:13px!important;color:var(--ink)!important}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.pedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.pedit div{position:relative;aspect-ratio:4/3;background:var(--band)}
.pedit img{width:100%;height:100%;object-fit:cover}
.pedit button{all:unset;cursor:pointer;position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center}
.colrow{display:grid;grid-template-columns:1fr 70px 28px;gap:6px;align-items:center}
.hr{height:1px;background:var(--grid);margin:4px 0}
.small{font-size:11px;color:var(--muted);margin:0}
.banner{display:none;width:100%;align-items:center;gap:10px;padding:6px 0 0;color:#594300;font-size:12px}
.banner.on{display:flex}

/* ===== Intro: gridlines draw in, then the content fades up row by row ===== */
.introsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:7}
.introsvg line{stroke:var(--faint);stroke-width:1}
body.intro .grid th,body.intro .grid td{border-color:transparent}
body.intro .grid thead th,body.intro .grid th.rn{color:transparent}
body.intro .grid tbody tr>td:not(.photo){opacity:0}
body.intro .pwrap{animation:photopop 1.8s cubic-bezier(.2,.8,.2,1) .9s both}
body.intro .grid tbody td{background:transparent!important}
body.reveal .grid thead th,body.reveal .grid th.rn{animation:fadein .5s both}
body.reveal .grid tbody tr>td{animation:rowin .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--r,0) * 28ms)}
body.reveal .grid tbody tr{--r:inherit}
@keyframes photopop{0%{opacity:0;transform:scale(.86)}70%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media (max-width:720px){
  :root{--gutter:32px}
  .grid{font-size:max(var(--fs),11px)}
  .name{font-size:18px}
  .tag{font-size:12px;gap:2px 12px}
  .top{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px}
  .drawer{top:auto;height:82%;width:100%;transform:translateY(105%);border-left:0;border-top:1px solid var(--grid)}
  .drawer.on{transform:none}
  .status{display:none}
  .top{position:relative}
  .theme{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <h1 class="name" id="siteName">Suyeon Shin</h1>
    <div class="tag" id="tag"></div>
    <button class="theme" id="themebtn" data-act="theme" aria-label="Switch to dark mode"></button>
    <div class="editbar" id="editbar">
      <button class="btn" data-act="add-entry">+ Row</button>
      <button class="btn" data-act="add-section">+ Section</button>
      <button class="btn" data-act="tab-settings">Sheet settings</button>
      <button class="btn" data-act="threads">Edit interest areas</button>
      <button class="btn" data-act="export-json">Export JSON</button>
      <button class="btn" data-act="import-json">Import JSON</button>
      <button class="btn primary" data-act="download">Download site</button>
      <span class="savestate" id="savestate"></span>
    </div>
    <div class="banner" id="banner"><span id="bannertext"></span><button class="btn" data-act="discard">Discard draft</button></div>
  </header>
  <main class="gridwrap" id="gridwrap"></main>
  <nav class="tabs" aria-label="Sheets">
    <div class="tablist" id="tabs" role="tablist"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </nav>
</div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Editor">
  <div class="dh"><span id="crumb"></span><button class="xbtn" data-act="close" aria-label="Close">×</button></div>
  <div class="db" id="dbody"></div>
</aside>
<div class="lb" id="lb" role="dialog" aria-label="Photo viewer"><img id="lbimg" alt=""><button class="prev" data-act="lb-prev" aria-label="Previous">‹</button><button class="next" data-act="lb-next" aria-label="Next">›</button><button class="x" data-act="lb-close" aria-label="Close">×</button></div>
<input type="file" id="filein" accept="image/*" multiple hidden>
<input type="file" id="jsonin" accept="application/json,.json" hidden>

<!--
  ============================================================
  ALL CONTENT LIVES IN THE JSON BELOW.
  Easiest way to edit: open the site with ?edit at the end of the URL
  (e.g. https://your-site.vercel.app/?edit), make changes, press
  "Download site", and replace index.html in your project with the file.
  ============================================================
-->

 },
 "threads": [

   ]
  },

   ]
  },
  {

   ]
  },
  {
   "id": "build",
   "name": "Building",
   "color": "#FF6D00",
   "family": "Building organisations & experiences",
   "keywords": [
    "Startups",

   "bios": [
    {
     "label": "BIO (informal, 2026)",
     "text": "Everyone asks Suyeon Shin which field comes next, and the answer is: all of them, eventually. So far, Suyeon has co-founded one (1) photobooth business across four (4) sites, used its profits to help keep one (1) youth fair free for 1,500+ people, built one (1) smart water-tap attachment on a S$50K grant as the youngest team awarded, cold-emailed fifty-three (53) malls and speakers, played on one (1) squash team that won three (3) national titles, carried one (1) gigantic Polaroid camera to almost everything, and lost countless (xn) hands of poker in the name of game theory. Suyeon is left-handed, blood type O and an INTJ, dreams in English but thinks in Korean, is trying to learn jiu-jitsu, and has strong opinions on Trader Joe's snacks. The plan: live a disciplined life, spontaneously. Friends call all of this Ssussu's World."
    },
    {
     "label": "BIO (formal, 2-lines)",
     "text": "Suyeon Shin is a builder based between Singapore, Seoul and Berkeley, studying Economics and Sociology at UC Berkeley. Suyeon co-founded To Our Youth, a photobooth business with four sites across Singapore, and Hello World Fest, a free youth discovery fair for 1,500+ people."
    },
    {
     "label": "BIO (formal, 4-lines)",
     "text": "Suyeon Shin is a builder based between Singapore, Seoul and Berkeley, studying Economics and Sociology at UC Berkeley. Suyeon co-founded To Our Youth, a photobooth business with four sites and a Golden Village partnership, and used its profits to help keep Hello World Fest, Singapore's largest youth discovery fair, free for 1,500+ attendees. Suyeon also co-founded HOO, a smart water-tap startup and the youngest team to win a S$50K Youth Action Challenge grant. The work moves between culture, public policy and building organisations, guided by a belief in the power of words."
    },
    {
     "label": "BIO (formal, long)",
     "text": "Suyeon Shin is a builder based between Singapore, Seoul and Berkeley, studying Economics and Sociology at UC Berkeley. Most of Suyeon's work started from nothing. To Our Youth began with a rent negotiation in school uniform at VivoCity; after cold-pitching 36+ malls, it grew into a photobooth business with four sites and a partnership with Golden Village, earning S$200K+ in revenue in two years. Its booths are built for unposed photos, with a short shutter delay and only two retakes. Its profits helped fund Hello World Fest, the free youth discovery fair Suyeon co-founded with the Hello World Foundation, which raised S$128K from the National Youth Council and Temasek Foundation and drew 1,500+ attendees. Suyeon also co-founded HOO, a social enterprise behind a smart water-tap attachment, built with NUS and backed by S$69K+ in grants, and Learning Seeds, a mentoring programme for children from low-income families that grew from a 13-week pilot into a three-year programme.\n\nSuyeon placed 2nd of 453 teams from 32 countries at the Global Youth Entrepreneurship Challenge and was a Halogen National Young Leaders Fellow (Top 30). As Head Prefect of Raffles Girls' School, Suyeon led a 62-member board and rebuilt the demerit system around mentorship; at Raffles Institution, Suyeon captained the squash team and studied in the Humanities Programme as an MOE Humanities Scholar. At Berkeley, Suyeon sits on the board of Poker@Berkeley and the tech committee of The Berkeley Forum.\n\nSuyeon dreams in English, thinks in Korean and also speaks Mandarin. Suyeon believes in the power of words, loves romance enough to chase it on purpose, and would rather trust people and be let down than not trust at all. Having too many interests used to feel frustrating; Suyeon is learning to be grateful for it instead. The long-term plan is to build a space that promotes romanticism, something like a jazz bar or a place where people exchange ideas."
    },
    {
     "label": "BIO (한국어, informal)",
     "text": "Suyeon Shin 은 싱가포르, 서울, 버클리를 오가며 지낸다. 십 대 때 교복을 입고 비보시티 관리사무소에 찾아가 임대료를 깎는 협상을 한 것을 시작으로 포토부스 사업 To Our Youth를 공동 창업했고, 그 수익으로 1,500명이 넘게 찾은 청소년 박람회 Hello World Fest를 무료로 열었다. 물 절약 스마트 수도꼭지 스타트업과 저소득층 아이들을 위한 멘토링 프로그램도 처음부터 만들었다. 영어로 꿈은 꾸는 것 같은데, 생각은 한국어로 하는 게 편하다. 왼손잡이, O형, INTJ. 말의 힘을 엄청 믿고, 낭만을 엄청 좋아해서 일부러 쫓기도 한다. 사람을 너무 쉽게 믿지 말라고들 하지만, 차라리 믿고 배신당하는 게 낫다고 생각한다. 관심사가 너무 많은 게 한때는 답답했는데, 지금은 그걸 감사히 생각하려고 노력 중이다."
    }

/* floating keyword cloud: every area's keywords, interleaved */

/* ---------- threads chart ---------- */
function threadStats() {
  const items = allItems(), pair = {}, main = {}, also = {};
  data.threads.forEach(t => { main[t.id] = 0; also[t.id] = 0; });
  items.forEach(({row}) => { const [a, b] = row.threads; if (a in main) main[a]++; if (b && b in also) also[b]++; if (a && b && a !== b && T(a) && T(b)) { const k = [a, b].sort().join("|"); (pair[k] = pair[k] || []).push(row); } });

}
function threadSVG() {
  const W = 780, H = 470, cx = W / 2, cy = H / 2 + 4, R = 160, ts = data.threads, st = threadStats();
  if (!ts.length) return "";
  const pos = {};
  ts.forEach((t, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / ts.length; pos[t.id] = {x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a}; });
  const maxW = Math.max(1, ...Object.values(st.pair).map(v => v.length));
  let defs = "", edges = "", labels = "";
  Object.entries(st.pair).sort((p, q) => p[1].length - q[1].length).forEach(([k, rows], idx) => {
    const [a, b] = k.split("|"), p = pos[a], q = pos[b], w = rows.length;
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, c = {x: mx + (cx - mx) * .45, y: my + (cy - my) * .45};
    defs += `<linearGradient id="g${idx}" gradientUnits="userSpaceOnUse" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"><stop offset="0" stop-color="${colorOf(a)}"/><stop offset="1" stop-color="${colorOf(b)}"/></linearGradient>`;
    edges += `<path class="edge" data-pair="${k}" d="M${p.x},${p.y} Q${c.x},${c.y} ${q.x},${q.y}" stroke="url(#g${idx})" stroke-width="${1.2 + 10 * w / maxW}" fill="none" opacity=".55"><title>${esc(T(a).name)} + ${esc(T(b).name)}: ${w}</title></path>`;
    const lx = .25 * p.x + .5 * c.x + .25 * q.x, ly = .25 * p.y + .5 * c.y + .25 * q.y;
    labels += `<g class="elab" data-pair="${k}" pointer-events="none"><rect x="${lx - 10}" y="${ly - 8}" width="20" height="16" style="fill:var(--paper);stroke:var(--grid)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="10.5" font-family="Arial" font-weight="700" style="fill:var(--ink)">${w}</text></g>`;
  });
  const maxT = Math.max(1, ...ts.map(t => st.main[t.id] + st.also[t.id]));
  const nodes = ts.map(t => {
    const p = pos[t.id], tot = st.main[t.id] + st.also[t.id], r = 14 + 16 * Math.sqrt(tot / maxT);
    const lx = cx + (R + r + 14) * Math.cos(p.a), ly = cy + (R + r + 14) * Math.sin(p.a);
    const anchor = Math.abs(Math.cos(p.a)) < .2 ? "middle" : (Math.cos(p.a) > 0 ? "start" : "end");
    const dy = Math.sin(p.a) < -.5 ? -2 : (Math.sin(p.a) > .5 ? 12 : 4);

    svg.querySelectorAll(".elab").forEach(e => e.style.opacity = none || (node && link(e.dataset.pair, node)) || pair === e.dataset.pair ? 1 : .1);

/* ---------- intro: gridlines draw themselves, then rows fade up ---------- */
function intro() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = $("#gridwrap"), tbl = wrap.querySelector("table"); if (!tbl) return;
  document.body.classList.add("intro");
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  let acc = mobile() ? 32 : 40; const xs = [acc, ...tbl.dataset.w.split(",").map(w => (acc += +w))].filter(x => x < vw + 2);
  const ys = [...tbl.querySelectorAll("tbody tr")].map(tr => tr.offsetTop + tr.offsetHeight).filter(y => y < vh + 2);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "introsvg"); svg.setAttribute("width", vw); svg.setAttribute("height", vh);
  const line = (x1, y1, x2, y2, delay, dur) => {
    const l = document.createElementNS(ns, "line"), len = Math.hypot(x2 - x1, y2 - y1);
    Object.entries({x1, y1, x2, y2}).forEach(([k, v]) => l.setAttribute(k, v));
    l.style.strokeDasharray = len; l.style.strokeDashoffset = len;
    l.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: dur, delay, easing: "cubic-bezier(.6,0,.2,1)", fill: "forwards"});
    svg.appendChild(l);
  };
  ys.forEach((y, k) => line(0, y + .5, vw, y + .5, k * 45, 1200));
  xs.forEach((x, k) => line(x - .5, 0, x - .5, vh, 300 + k * 110, 1300));
  wrap.appendChild(svg);
  const name = $("#siteName"), full = data.site.name; name.textContent = "";
  const caret = document.createElement("span"); caret.className = "caret";
  let k = 0; const type = () => { name.textContent = full.slice(0, ++k); name.appendChild(caret); if (k < full.length) setTimeout(type, 85); else setTimeout(() => caret.remove(), 1400); };
  setTimeout(type, 150);
  const total = Math.min(3600, Math.max(ys.length * 45 + 1200, 300 + xs.length * 110 + 1300));
  setTimeout(() => { document.body.classList.remove("intro"); document.body.classList.add("reveal"); svg.animate([{opacity: 1}, {opacity: 0}], {duration: 500, fill: "forwards"}); }, total - 150);
  setTimeout(() => { svg.remove(); document.body.classList.remove("reveal"); }, total + 1800);
}

    if (t.dataset.delthread != null) { const th = data.threads[+t.dataset.delthread]; if (confirm(`Delete the "${th.name}" thread? Rows tagged with it lose that tag.`)) { data.threads.splice(+t.dataset.delthread, 1); data.tabs.forEach(tb => (tb.rows || []).forEach(r => { if (r.threads) r.threads = r.threads.filter(x => x !== th.id); })); changed(); threadSettings(); } return; }
    const tab = curTab();
    switch (t.dataset.act) {
      case "close": return closeDrawer();
      case "theme": { const d = dark() ? "light" : "dark"; document.documentElement.dataset.theme = d; try { localStorage.setItem("ssussu-theme", d); } catch (e) {} return render(); }
      case "addbio": { const p = curTab(); (p.bios = p.bios || []).push({label: "New bio", text: ""}); changed(); return editProfile(); }
      case "lb-close": return $("#lb").classList.remove("on");
      case "lb-prev": return stepLB(-1);
      case "lb-next": return stepLB(1);
      case "add-entry": return insertRow("item");
      case "add-section": return insertRow("section");
      case "tab-settings": return tabSettings();
      case "threads": return threadSettings();
      case "add-tab": { const id = "sheet" + Date.now().toString(36); data.tabs.push({id, name: "New sheet", type: "sheet", columns: [{key: "org", label: "Title", w: 240}, {key: "role", label: "Role", w: 220}, {key: "date", label: "Date", w: 110}, {key: "place", label: "Location", w: 110}, {key: "note", label: "Notes", w: 380}, {key: "link", label: "Link", w: 56, kind: "link"}, {key: "photos", label: "Photos", w: 120, kind: "photos"}], rows: [{type: "section", text: "New section"}]}); changed(); setTab(id); return tabSettings(); }
      case "tab-left": case "tab-right": { const k = data.tabs.indexOf(tab), j = k + (t.dataset.act === "tab-left" ? -1 : 1); if (j >= 0 && j < data.tabs.length) { [data.tabs[k], data.tabs[j]] = [data.tabs[j], data.tabs[k]]; changed(); } return; }
      case "del-tab": if (data.tabs.length > 1 && confirm(`Delete the "${tab.name}" sheet and everything on it?`)) { data.tabs.splice(data.tabs.indexOf(tab), 1); state.tab = data.tabs[0].id; closeDrawer(); changed(); } return;
      case "addcol": { const at = tab.columns.findIndex(c => c.kind === "link"); tab.columns.splice(at >= 0 ? at : tab.columns.length, 0, {key: "col" + Date.now().toString(36), label: "New column", w: 140}); changed(); return tabSettings(); }
      case "addthread": data.threads.push({id: "t" + Date.now().toString(36), name: "New area", family: "New area", color: "#00E5FF", keywords: ["New keyword"]}); changed(); return threadSettings();
      case "up": case "down": { const i = state.editRow, j = i + (t.dataset.act === "up" ? -1 : 1); if (j < 0 || j >= tab.rows.length) return; [tab.rows[i], tab.rows[j]] = [tab.rows[j], tab.rows[i]]; changed(); return editRow(j); }
      case "dup": { const i = state.editRow; tab.rows.splice(i + 1, 0, clone(tab.rows[i])); changed(); return editRow(i + 1); }
      case "delrow": if (confirm("Delete this row?")) { tab.rows.splice(state.editRow, 1); closeDrawer(); changed(); } return;
      case "upload": return $("#filein").click();
      case "photo-url": { const u = prompt("Photo URL or path (e.g. /photos/vivocity.jpg)"); if (u && u.trim()) { photoTarget().photos.push(u.trim()); changed(); reopen(); } return; }
      case "download": download("index.html", buildSite(), "text/html"); $("#savestate").textContent = "Downloaded. Replace index.html in your project to publish."; return;
      case "export-json": return download("portfolio-data.json", JSON.stringify(data, null, 1), "application/json");
      case "import-json": return $("#jsonin").click();
      case "discard": if (confirm("Discard your draft and go back to the published version?")) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} data = clone(published); $("#banner").classList.remove("on"); render(); } return;
    }
    return;
  }
  // cell selection, like a spreadsheet
  const td = e.target.closest("#gridwrap td");
  if (!td || e.target.closest("a,button,svg,.info")) return;
  document.querySelectorAll("#gridwrap .sel,#gridwrap th.on").forEach(x => x.classList.remove("sel", "on"));
  td.classList.add("sel");
  const tr = td.closest("tr"), c = +(td.dataset.c || 0), ch = $(`#gridwrap thead th[data-colh="${c}"]`), rn = tr.querySelector("th.rn");
  if (ch) ch.classList.add("on"); if (rn) rn.classList.add("on");
  const tab = curTab();
  if (tab.type === "sheet" && tr.dataset.i != null) { const r = tab.rows[+tr.dataset.i]; status(r && r.threads, ""); if (EDIT) editRow(+tr.dataset.i); }
  else if (EDIT && tab.type === "profile" && tr.dataset.prow != null) editProfile();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#lb").classList.remove("on"); if (EDIT) closeDrawer(); }
  if ($("#lb").classList.contains("on")) { if (e.key === "ArrowLeft") stepLB(-1); if (e.key === "ArrowRight") stepLB(1); }
});
$("#gridwrap").addEventListener("mouseover", e => {
  const tr = e.target.closest("tr.item"); if (!tr) return;
  const r = curTab().rows[+tr.dataset.i]; if (r) status(r.threads, "");
});
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") $("#lb").classList.remove("on"); });
document.addEventListener("input", e => {
  const f = e.target.form; if (!f) return;
  clearTimeout(f._t); f._t = setTimeout(() => ({rowform: applyRow, tabform: applyTab, threadform: applyThreads, profform: applyProfile})[f.id]?.(f), 300);
});
document.addEventListener("submit", e => e.preventDefault());
$("#filein").addEventListener("change", async e => {
  const r = photoTarget(); if (!r) return;
  for (const f of e.target.files) { try { r.photos.push(await compress(f)); } catch (err) { alert(err.message); } }
  e.target.value = ""; changed(); reopen();
});
$("#jsonin").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.tabs || !d.threads) throw new Error("This file isn't portfolio data."); data = d; state.tab = data.tabs[0].id; changed(); } catch (err) { alert(err.message); }
  e.target.value = "";
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { render(); document.body.style.setProperty("--toph", $("#top").offsetHeight + "px"); }, 150); });
addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== state.tab && tabOf(id)) setTab(id); });

if (EDIT) {
  $("#savestate").textContent = "Edit mode: changes save as a draft on this device";
  if (draftNote) { $("#bannertext").textContent = draftNote; $("#banner").classList.add("on"); }
}
render();
document.body.style.setProperty("--toph", $("#top").offsetHeight + "px");
if (!EDIT) intro();
})();
</script>
</body>
